name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master"] # Замените на вашу основную ветку, если это не main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3 # Явно указываем вашу версию pnpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Рекомендуемая LTS-версия для Next.js 16
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ВАЖНО: Не используем static_site_generator: next,
      # чтобы actions/configure-pages не перезаписывал ваш next.config.ts.
      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v5

      - name: Build with Next.js
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
